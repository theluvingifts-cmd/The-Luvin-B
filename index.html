<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="https://res.cloudinary.com/dbdqd93km/image/upload/v1763705477/ce3r3dzdpp2gn5nv3jdx.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Luvin - Thương hiệu quà tặng tinh tế</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@400;500;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'luvin-pink': '#efa3b5',
              'luvin-cream': '#f4eee8',
              'luvin-light-gray': '#d8d8d8',
            },
            fontFamily: {
              // Cấu hình BrandFont làm ưu tiên số 1
              heading: ['BrandFont', 'Playfair Display', 'serif'],
              body: ['Montserrat', 'sans-serif'],
              script: ['BrandFont', 'Dancing Script', 'cursive'], 
            },
            boxShadow: {
              'top': '0 -4px 6px -1px rgb(0 0 0 / 0.1), 0 -2px 4px -2px rgb(0 0 0 / 0.1)',
            },
            animation: {
              marquee: 'marquee 80s linear infinite',
            },
            keyframes: {
              marquee: {
                '0%': { transform: 'translateX(0%)' },
                '100%': { transform: 'translateX(-50%)' },
              },
            },
          }
        }
      }
    </script>
    <style>
      :root {
        color-scheme: light;
      }
      
      /* KHAI BÁO FONT CHỮ THƯƠNG HIỆU CHUẨN XÁC */
      @font-face {
        font-family: 'BrandFont';
        /* Thử cả đường dẫn tương đối và tuyệt đối để đảm bảo trình duyệt tìm thấy */
        src: url('/brand-font.ttf') format('truetype'), 
             url('brand-font.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: block;
      }
      
      /* Class ép buộc dùng font thương hiệu (độ ưu tiên cao nhất) */
      .font-brand-heading {
        font-family: 'BrandFont', 'Playfair Display', serif !important;
      }
      
      body {
        font-family: 'Montserrat', sans-serif;
        background-color: #f9f4ef;
      }
      
      button, a, input, select, textarea, .cursor-pointer {
        pointer-events: auto;
      }

      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .group:hover .animate-marquee {
        animation-play-state: paused;
      }
      
      input, select, textarea {
        background-color: #ffffff !important;
        color: #1f2937 !important;
        border-color: #d1d5db;
        user-select: text;
        -webkit-user-select: text;
      }

      input:-webkit-autofill,
      input:-webkit-autofill:hover, 
      input:-webkit-autofill:focus, 
      input:-webkit-autofill:active {
          -webkit-box-shadow: 0 0 0 30px white inset !important;
          -webkit-text-fill-color: #1f2937 !important;
          transition: background-color 5000s ease-in-out 0s;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "path": "https://aistudiocdn.com/path@^0.12.7",
    "vite": "https://aistudiocdn.com/vite@^7.2.2",
    "@vitejs/plugin-react": "https://aistudiocdn.com/@vitejs/plugin-react@^5.1.1",
    "nodemailer": "https://aistudiocdn.com/nodemailer@^7.0.10",
    "firebase/": "https://aistudiocdn.com/firebase@^12.6.0/",
    "url": "https://aistudiocdn.com/url@^0.11.4"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
