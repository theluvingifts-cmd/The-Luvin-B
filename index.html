    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'luvin-pink': 'var(--color-primary)',
              'luvin-cream': 'var(--color-secondary)',
              primary: 'var(--color-primary)',
              secondary: 'var(--color-secondary)',
              accent: 'var(--color-accent)',
              'site-bg': 'var(--color-bg)',
              'site-text': 'var(--color-text)',
            },
            fontFamily: {
              heading: ['var(--font-heading)', 'Playfair Display', 'serif'],
              body: ['var(--font-body)', 'Montserrat', 'sans-serif'],
              script: ['Dancing Script', 'cursive'], 
            },
            borderRadius: {
              'global': 'var(--radius-global)',
            },
            boxShadow: {
              'top': '0 -4px 6px -1px rgb(0 0 0 / 0.1), 0 -2px 4px -2px rgb(0 0 0 / 0.1)',
            },
            animation: {
              marquee: 'marquee 80s linear infinite',
              'fade-in': 'fadeIn 0.5s ease-out forwards',
              'bounce-small': 'bounceSmall 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)',
              'fade-in-up': 'fadeInUp 0.4s ease-out forwards',
            },
            keyframes: {
              marquee: {
                '0%': { transform: 'translateX(0%)' },
                '100%': { transform: 'translateX(-50%)' },
              },
              fadeIn: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              bounceSmall: {
                '0%, 100%': { transform: 'scale(1)' },
                '50%': { transform: 'scale(0.95)' },
              }
            },
          }
        }
      }
    </script>

      :root {

      }
      
      body {
        font-family: var(--font-body), 'Montserrat', sans-serif;
        background-color: var(--color-bg);
        color: var(--color-text);
      }
      
      h1, h2, h3, h4, h5, h6 {

      }

      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      
      .skeleton {
        animation: shimmer 2s infinite linear;
        background: linear-gradient(to right, #f6f7f8 4%, #edeef1 25%, #f6f7f8 36%);
        background-size: 1000px 100%;
      }

      @keyframes shimmer {
        0% { background-position: -1000px 0; }
        100% { background-position: 1000px 0; }
      }

      @media print {
        header, footer, nav, .print-hidden { display: none !important; }
        main { padding: 0 !important; margin: 0 !important; }
        .print-only { display: block !important; }
        @page { margin: 0; size: A4; }
        body { background: white; }
      }

      .custom-scrollbar::-webkit-scrollbar { width: 4px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: #e5e7eb; border-radius: 10px; }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #d1d5db; }
