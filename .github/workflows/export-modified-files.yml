name: Export modified files

on:
  push:
    paths:
      - '.github/workflows/export-modified-files.yml'

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare files with repo structure
        run: |
          mkdir -p export/pages
          cp pages/CheckoutPage.tsx export/pages/CheckoutPage.tsx
      - name: Upload modified files
        uses: actions/upload-artifact@v4
        with:
          name: the-luvin-files-changed
          path: export/
          retention-days: 1
